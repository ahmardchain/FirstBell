<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Buy your first tokenized stock on BNB Smart Chain with FirstBell. Familiar login, local-currency card or bank funding, USDT withdrawals and supported gas sponsorship." />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('firstbell-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.lang = localStorage.getItem('firstbell-language') === 'zh' ? 'zh-CN' : 'en';
      } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/firstbell-mark.svg" />
    <title>FirstBell — Your first stock, on-chain.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
